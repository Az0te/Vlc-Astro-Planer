on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4 # Mantener v4 es seguro, pero puedes usar versiones superiores cuando salgan

      - name: Setup Java
        uses: actions/setup-java@v5 # Actualizado de v4 a v5 para eliminar la advertencia de obsolescencia
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install
          bun add qrcode @types/qrcode jsqr
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: bun run build

      - name: Initialize and Sync Android
        run: |
          node ./node_modules/@capacitor/cli/bin/capacitor add android || true
          node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
