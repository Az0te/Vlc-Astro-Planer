name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Se activa automáticamente cuando subes una etiqueta de versión como v1.0.0, v1.1.2, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install
          bun add qrcode @types/qrcode jsqr
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: bun run build

      - name: Initialize and Sync Android
        run: |
          node ./node_modules/@capacitor/cli/bin/capacitor add android || true
          node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Renombramos el APK para que no se llame genéricamente "app-debug.apk" en tus Releases
      - name: Rename APK for Release
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Vlc-Astro-Planer-${{ github.ref_name }}.apk
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ESTE PASO SUBE EL APK AUTOMÁTICAMENTE A TU SECCIÓN DE RELEASES
      - name: Create GitHub Release and Upload APK
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') # Solo se ejecuta si es una etiqueta de versión (Tag)
        with:
          artifacts: "android/app/build/outputs/apk/debug/*.apk"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
