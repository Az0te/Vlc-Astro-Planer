on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'  # <--- CAMBIADO DE VUELTA A 21 PARA QUE COINCIDA CON TU PROYECTO

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools' # Forzamos que ignore el paquete obsoleto 'tools'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          bun install
          bun add qrcode @types/qrcode jsqr  # <-- ELIMINADO '@types/jsqr'
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: bun run build

      - name: Initialize and Sync Android
        run: |
          node ./node_modules/@capacitor/cli/bin/capacitor add android || true
          node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
